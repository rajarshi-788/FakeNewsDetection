<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fake News Detection System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 50%;
            margin: 80px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #003399;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066ff;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0047b3;
        }

        .result-box {
            margin-top: 20px;
            padding: 14px;
            background: #f7f7f7;
            border-left: 4px solid #444;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Fake News Detection System</h2>

    <form action="/check-news" method="post">
        <textarea name="text" placeholder="Enter any news to predict..." required></textarea>
        <button type="submit">Check News</button>
    </form>

    <!-- Display prediction exactly from backend -->
    <div th:if="${prediction}">
        <div class="result-box">
            Prediction: <span th:text="${prediction}"></span>
        </div>
    </div>

</div>

</body>
</html>
